name = "fxembed-catgirlx"
account_id = "[CLOUDFLARE_ACCOUNT_ID]"
main = "./dist/worker.js"
compatibility_date = "2026-04-11"
send_metrics = false

# Static branding asset served by the Worker at /catgirlicon.png.
[assets]
directory = "./assets"
binding = "ASSETS"

# Deployment values belong in Actions variables/secrets, not this public file.
[build]
command = "npm run build"
