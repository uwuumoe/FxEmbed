name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # workflow_run runs with write-capable secrets; accept only our own successful main run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create wrangler.toml
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "${{ vars.CF_WORKER_NAME }}"
          account_id = "${{ vars.CF_ACCOUNT_ID }}"
          main = "./dist/worker.js"
          compatibility_date = "${{ vars.CF_COMPATIBILITY_DATE }}"
          no_bundle = true
          analytics_engine_datasets = [{ binding = "AnalyticsEngine" }]
          [assets]
          directory = "./assets"
          binding = "ASSETS"
          [ai]
          binding = "AI"
          [build]
          command = "npm run build"
          [[containers]]
          class_name = "MediaTranscoder"
          image = "./services/media-transcoder/Dockerfile"
          instance_type = "standard2"
          max_instances = 4
          [[durable_objects.bindings]]
          class_name = "MediaTranscoder"
          name = "MEDIA_TRANSCODER"
          [[migrations]]
          new_sqlite_classes = ["MediaTranscoder"]
          tag = "media-transcoder-v1"
          EOF
      - name: Deploy with Wrangler
        # Publish the container image as part of the production deployment.
        run: npx wrangler deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STANDARD_DOMAIN_LIST: ${{ vars.STANDARD_DOMAIN_LIST }}
          STANDARD_BSKY_DOMAIN_LIST: ${{ vars.STANDARD_BSKY_DOMAIN_LIST }}
          STANDARD_TIKTOK_DOMAIN_LIST: ${{ vars.STANDARD_TIKTOK_DOMAIN_LIST }}
          STANDARD_INSTAGRAM_DOMAIN_LIST: ${{ vars.STANDARD_INSTAGRAM_DOMAIN_LIST }}
          DIRECT_MEDIA_DOMAINS: ${{ vars.DIRECT_MEDIA_DOMAINS }}
          TEXT_ONLY_DOMAINS: ${{ vars.TEXT_ONLY_DOMAINS }}
          INSTANT_VIEW_DOMAINS: ${{ vars.INSTANT_VIEW_DOMAINS }}
          GALLERY_DOMAINS: ${{ vars.GALLERY_DOMAINS }}
          FORCE_MOSAIC_DOMAINS: ${{ vars.FORCE_MOSAIC_DOMAINS }}
          QUIET_DOMAINS: ${{ vars.QUIET_DOMAINS }}
          OLD_EMBED_DOMAINS: ${{ vars.OLD_EMBED_DOMAINS }}
          MOSAIC_DOMAIN_LIST: ${{ vars.MOSAIC_DOMAIN_LIST }}
          POLYGLOT_DOMAIN_LIST: ${{ vars.POLYGLOT_DOMAIN_LIST }}
          MOSAIC_BSKY_DOMAIN_LIST: ${{ vars.MOSAIC_BSKY_DOMAIN_LIST }}
          MEDIA_PROXY_DOMAIN_LIST: ${{ vars.MEDIA_PROXY_DOMAIN_LIST }}
          GIF_TRANSCODE_DOMAIN_LIST: ${{ vars.GIF_TRANSCODE_DOMAIN_LIST }}
          VIDEO_TRANSCODE_DOMAIN_LIST: ${{ vars.VIDEO_TRANSCODE_DOMAIN_LIST }}
          VIDEO_TRANSCODE_BSKY_DOMAIN_LIST: ${{ vars.VIDEO_TRANSCODE_BSKY_DOMAIN_LIST }}
          PBS_PROXY_DOMAIN_LIST: ${{ vars.PBS_PROXY_DOMAIN_LIST }}
          API_HOST_LIST: ${{ vars.API_HOST_LIST }}
          BLUESKY_API_HOST_LIST: ${{ vars.BLUESKY_API_HOST_LIST }}
          ATMOSPHERE_API_HOST_LIST: ${{ vars.ATMOSPHERE_API_HOST_LIST }}
          BLUESKY_VIDEO_BASE: ${{ vars.BLUESKY_VIDEO_BASE }}
          TWITTER_ROOT: ${{ vars.TWITTER_ROOT }}
          INSTAGRAM_ROOT: ${{ vars.INSTAGRAM_ROOT }}
          INSTAGRAM_API_ROOT: ${{ vars.INSTAGRAM_API_ROOT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Preserve credential binding
        env:
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CREDENTIAL_KEY" ]; then
            printf '%s' "$CREDENTIAL_KEY" | npx wrangler secret put CREDENTIAL_KEY --name "${{ vars.CF_WORKER_NAME }}"
          else
            echo 'CREDENTIAL_KEY is not configured; preserving existing binding.'
          fi
